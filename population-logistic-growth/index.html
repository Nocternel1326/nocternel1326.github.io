<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistic Growth · Real Population Simulation</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }

    body {
      background: #fdf8e0;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .netlogo-panel {
      background: #f5eec8;
      border-radius: 1.5rem;
      padding: 1.5rem 2rem 1.8rem 2rem;
      max-width: 1400px;
      width: fit-content;
      box-shadow: 0 20px 30px -10px rgba(120, 100, 40, 0.5);
      border: 2px solid #d4c48a;
    }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; color: #3a3020; }
    .title-section { display: flex; align-items: center; gap: 0.75rem; }
    .title-section h1 { font-size: 1.5rem; font-weight: 600; margin: 0; color: #3a3020; letter-spacing: 0.2px; }

    .speed-row {
      display: flex; align-items: center; gap: 1rem;
      margin: 0.5rem 0 1.2rem 0; color: #4a3f28; font-size: 0.9rem; font-weight: 500;
    }
    .speed-row input {
      flex: 1; height: 8px; -webkit-appearance: none;
      background: #d4c48a; border-radius: 10px; cursor: pointer; border: 1px solid #b8a86a;
    }
    .speed-row input::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px;
      background: #8a7a4a; border-radius: 50%; border: 2px solid #fff8d8;
      box-shadow: 0 2px 6px rgba(80, 60, 20, 0.5); cursor: pointer;
    }

    .world-and-params {
      display: flex; gap: 2rem; align-items: flex-start;
      flex-wrap: wrap; justify-content: center;
    }

    .world-container {
      background: #fdf8e0; border-radius: 12px; padding: 6px;
      box-shadow: inset 0 0 12px #d4cba6, 0 8px 12px rgba(120, 100, 40, 0.4);
      border: 2px solid #c8b87a;
    }
    .world-canvas {
      display: block; width: 500px; height: 300px;
      border-radius: 6px; background: #fdf8e0;
    }
    .tick-label {
      margin-top: 8px; font-family: 'SF Mono', monospace;
      font-size: 0.85rem; color: #5a4a2a; padding-left: 6px; font-weight: 600;
    }

    .params-panel {
      background: #efe6c0; border-radius: 12px;
      padding: 1rem 1.5rem 1.2rem 1.5rem;
      box-shadow: inset 0 1px 3px #fff8e0, 0 6px 10px rgba(120, 100, 40, 0.3);
      border: 2px solid #d4c48a; min-width: 300px; color: #3a3020;
    }
    .params-panel h2 {
      font-size: 1.2rem; font-weight: 600; text-align: center;
      margin: 0 0 0.75rem 0; color: #3a3020; letter-spacing: 0.5px;
    }

    .param-group { display: flex; flex-direction: column; gap: 0.8rem; }
    .slider-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .slider-item .label-row {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; font-weight: 600; color: #4a3f28;
    }
    .slider-item .label-row span:last-child {
      font-family: 'SF Mono', monospace; background: #fff8e0;
      padding: 0.1rem 0.6rem; border-radius: 30px;
      font-size: 0.8rem; border: 1px solid #c8b87a; color: #3a3020;
    }
    .slider-item input[type=range] {
      width: 100%; height: 6px; -webkit-appearance: none;
      background: #d4c48a; border-radius: 10px;
      margin: 5px 0 2px; border: 1px solid #b8a86a;
    }
    .slider-item input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      background: #8a7a4a; border-radius: 50%; border: 2px solid #fff8d8;
      box-shadow: 0 1px 5px rgba(80, 60, 20, 0.5); cursor: pointer;
    }

    .birth-death-row { display: flex; gap: 0.8rem; margin-top: 1rem; justify-content: center; }
    .bd-box {
      background: #fff8e0; border-radius: 8px; padding: 0.4rem 0.8rem;
      text-align: center; border: 2px solid #c8b87a;
      box-shadow: inset 0 1px 4px #ffffff, 0 2px 3px rgba(120, 100, 40, 0.2);
      min-width: 80px;
    }
    .bd-box .bd-label {
      font-size: 0.7rem; font-weight: 700; color: #5a4a2a;
      letter-spacing: 0.3px; text-transform: uppercase;
    }
    .bd-box .bd-value {
      font-family: 'SF Mono', monospace; font-weight: 700;
      font-size: 1.2rem; color: #3a3020;
    }
    .bd-box.births .bd-value { color: #1a7a1a; }
    .bd-box.deaths .bd-value { color: #b02020; }

    .button-row { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; }
    .btn {
      background: #8a7a4a; border: none; color: #fff8e0;
      font-weight: 700; font-size: 0.95rem;
      padding: 0.6rem 1.5rem; border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #5a4a2a, 0 5px 12px rgba(80, 60, 20, 0.4);
      cursor: pointer; transition: all 0.08s ease;
      border: 1px solid #a89a5a;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5a4a2a, 0 5px 12px rgba(80, 60, 20, 0.4);
    }
    .btn-setup { background: #a89a5a; }
    .btn-go { background: #5a8a4a; }
    .btn-go.running { background: #b04040; border-color: #d06060; }

    .charts-row {
      display: flex; flex-wrap: wrap; gap: 1.2rem;
      margin-top: 1.8rem; justify-content: center;
    }
    .chart-card {
      background: #fffdf0; border-radius: 10px;
      padding: 0.8rem 0.8rem 0.3rem 0.8rem;
      box-shadow: 0 6px 12px rgba(120, 100, 40, 0.3);
      border: 2px solid #d4c48a; flex: 1 1 240px; max-width: 280px;
    }
    .chart-card .chart-title {
      display: flex; justify-content: space-between;
      font-size: 0.9rem; font-weight: 700; color: #3a3020;
      margin-bottom: 0.2rem; padding: 0 0.2rem;
    }
    .chart-card .chart-title span:last-child { color: #8a7a4a; font-weight: 400; }
    .chart-card canvas {
      width: 100% !important; height: 140px !important; max-height: 140px;
    }
  </style>
</head>
<body>
<div class="netlogo-panel">
  <div class="header">
    <div class="title-section">
      <h1>🌿 Logistic Growth · Real Population Simulation</h1>
    </div>
  </div>

  <div class="speed-row">
    <span style="min-width:50px;">Speed</span>
    <input type="range" id="speedSlider" min="1" max="20" value="8" step="1">
    <span id="speedValue" style="min-width: 45px; font-family: monospace;">8</span>
  </div>

  <div class="world-and-params">
    <div>
      <div class="world-container">
        <canvas id="worldCanvas" class="world-canvas" width="500" height="300"></canvas>
      </div>
      <div class="tick-label" id="tickDisplay">t = 0.00  |  N = 10</div>
    </div>

    <div class="params-panel">
      <h2>Population Parameters</h2>
      <div class="param-group">
        <div class="slider-item">
          <div class="label-row">
            <span>Initial Population (N₀)</span>
            <span id="n0ValDisplay">10</span>
          </div>
          <input type="range" id="n0Slider" min="1" max="300" value="10" step="1">
        </div>
        <div class="slider-item">
          <div class="label-row">
            <span>Growth Rate (r)</span>
            <span id="rValDisplay">1.20</span>
          </div>
          <input type="range" id="rSlider" min="0.1" max="1.5" value="1.2" step="0.01">
        </div>
        <div class="slider-item">
          <div class="label-row">
            <span>Carrying Capacity (K)</span>
            <span id="kValDisplay">600</span>
          </div>
          <input type="range" id="kSlider" min="100" max="1000" value="600" step="10">
        </div>
      </div>

      <div class="birth-death-row">
        <div class="bd-box births">
          <div class="bd-label">Births/tick</div>
          <div class="bd-value" id="birthsDisplay">0</div>
        </div>
        <div class="bd-box deaths">
          <div class="bd-label">Deaths/tick</div>
          <div class="bd-value" id="deathsDisplay">0</div>
        </div>
      </div>

      <div class="button-row">
        <button class="btn btn-setup" id="setupBtn">Setup</button>
        <button class="btn btn-go" id="goBtn">Go</button>
      </div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title"><span>Population Size</span><span>☰</span></div>
      <canvas id="popSizeChart" width="240" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title"><span>Population Growth Rate</span><span>☰</span></div>
      <canvas id="growthRateChart" width="240" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title"><span>Per Capita Growth Rate</span><span>☰</span></div>
      <canvas id="perCapitaChart" width="240" height="140"></canvas>
    </div>
  </div>
</div>

<script>
(function() {
  // ---------- parameters ----------
  let N0 = 10;
  let r = 1.2;
  let K = 600;

  let speedFactor = 8;
  const BASE_SPEED = 0.02;

  // ---------- simulation state ----------
  let currentTime = 0;
  let isRunning = false;
  let animationFrame = null;
  const T_MAX = 30;

  // The actual population (number of individuals)
  let population = 10;

  // History for charts — recorded each tick from actual simulation
  const historyTimes = [];
  const historyPops = [];
  const historyGrowth = [];      // dN/dt at each tick
  const historyPerCapita = [];   // (dN/dt)/N at each tick

  // ---------- world canvas ----------
  const canvas = document.getElementById('worldCanvas');
  const ctx = canvas.getContext('2d');
  const worldWidth = 500, worldHeight = 300;

  // Each agent: {x, y, state}
  // state: 'normal' | 'born' | 'dying'
  let agents = [];

  // ---------- drawing ----------
  function drawWorld() {
    ctx.fillStyle = '#fdf8e0';
    ctx.fillRect(0, 0, worldWidth, worldHeight);

    for (let a of agents) {
      if (a.state === 'dying') {
        ctx.strokeStyle = '#cc2222';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(a.x - 4, a.y - 4);
        ctx.lineTo(a.x + 4, a.y + 4);
        ctx.moveTo(a.x + 4, a.y - 4);
        ctx.lineTo(a.x - 4, a.y + 4);
        ctx.stroke();
      } else if (a.state === 'born') {
        ctx.fillStyle = '#22aa22';
        ctx.beginPath();
        ctx.arc(a.x, a.y, 3.0, 0, 2 * Math.PI);
        ctx.fill();
      } else {
        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.arc(a.x, a.y, 1.8, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
  }

  // ---------- convert population to number of dots (scaled) ----------
  function popToDots(pop) {
    const maxDots = 350;
    return Math.min(maxDots, Math.max(0, Math.round(pop)));
  }

  // ---------- spawn one agent at a random position ----------
  function spawnAgent(state) {
    return {
      x: Math.random() * (worldWidth - 8) + 4,
      y: Math.random() * (worldHeight - 8) + 4,
      state: state || 'normal'
    };
  }

  // ---------- remove all 'dying' agents from the previous tick ----------
  function clearOldDying() {
    agents = agents.filter(a => a.state !== 'dying');
    // Promote 'born' to 'normal' — they survived their birth tick
    for (let a of agents) {
      if (a.state === 'born') a.state = 'normal';
    }
  }

  // ---------- apply births: add 'births' new agents ----------
  function applyBirths(births) {
    for (let i = 0; i < births; i++) {
      agents.push(spawnAgent('born'));
    }
  }

  // ---------- apply deaths: mark 'deaths' random normal agents as dying ----------
  function applyDeaths(deaths) {
    // Collect indices of agents in 'normal' state
    const normalIdx = [];
    for (let i = 0; i < agents.length; i++) {
      if (agents[i].state === 'normal') normalIdx.push(i);
    }
    // Shuffle for random selection
    for (let i = normalIdx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [normalIdx[i], normalIdx[j]] = [normalIdx[j], normalIdx[i]];
    }
    const toMark = Math.min(deaths, normalIdx.length);
    for (let i = 0; i < toMark; i++) {
      agents[normalIdx[i]].state = 'dying';
    }
    // If we still need more (because all normal agents were exhausted),
    // mark any remaining agents regardless of state
    let remaining = deaths - toMark;
    if (remaining > 0) {
      for (let i = 0; i < agents.length && remaining > 0; i++) {
        if (agents[i].state !== 'dying') {
          agents[i].state = 'dying';
          remaining--;
        }
      }
    }
  }

  // ---------- ONE simulation tick ----------
  // The logistic model gives us the *expected* growth rate,
  // which we convert into discrete birth and death events.
  function tick(dt) {
    const N = population;
    if (N <= 0) return { births: 0, deaths: 0 };

    // Logistic model: dN/dt = r * N * (1 - N/K)
    // At the individual level:
    //   per-capita birth rate b = r
    //   per-capita death rate d = r * N / K
    // So:
    //   births per tick  = b * N * dt = r * N * dt
    //   deaths per tick  = d * N * dt = (r * N^2 / K) * dt
    const expectedBirths = r * N * dt;
    const expectedDeaths = (r * N * N / K) * dt;

    // Convert to integers using stochastic rounding
    // (preserves the expected value over many ticks)
    let births = Math.floor(expectedBirths);
    if (Math.random() < (expectedBirths - births)) births++;

    let deaths = Math.floor(expectedDeaths);
    if (Math.random() < (expectedDeaths - deaths)) deaths++;

    // Can't die more than we have
    deaths = Math.min(deaths, N);

    // Update population
    population = N + births - deaths;
    if (population < 0) population = 0;

    // Record actual growth and per-capita growth for the charts
    const actualGrowth = births - deaths;
    const actualPerCapita = N > 0 ? actualGrowth / N : 0;

    // Update history (charts are driven by actual simulation)
    historyTimes.push(currentTime);
    historyPops.push(population);
    historyGrowth.push({ N: N, rate: actualGrowth });   // store N at which this growth occurred
    historyPerCapita.push({ N: N, rate: actualPerCapita });

    return { births, deaths };
  }

  // ---------- main animation step ----------
  function stepSimulation() {
    if (!isRunning) return;

    // Advance simulation time
    const dt = BASE_SPEED * speedFactor;
    currentTime += dt;

    if (currentTime >= T_MAX) {
      currentTime = T_MAX;
      isRunning = false;
      document.getElementById('goBtn').classList.remove('running');
      document.getElementById('goBtn').textContent = 'Go';
    }

    // Clear last tick's dying agents (they are now removed)
    clearOldDying();

    // Run one tick of the simulation
    const { births, deaths } = tick(dt);

    // Apply births and deaths to the visual agents
    applyBirths(births);
    applyDeaths(deaths);

    // Draw
    drawWorld();

    // Update displays
    document.getElementById('tickDisplay').textContent =
      `t = ${currentTime.toFixed(2)}  |  N = ${population}`;
    document.getElementById('birthsDisplay').textContent = births;
    document.getElementById('deathsDisplay').textContent = deaths;

    // Update charts
    updateCharts();

    if (isRunning) {
      animationFrame = requestAnimationFrame(stepSimulation);
    } else {
      drawWorld();
    }
  }

  // ---------- charts ----------
  let chartSize, chartGrowth, chartPerCapita;

  function updateCharts() {
    // Population Size vs Time
    chartSize.data.labels = historyTimes.map(t => t.toFixed(2));
    chartSize.data.datasets[0].data = historyPops;
    const maxPop = Math.max(K * 1.15, population, ...historyPops, 10);
    chartSize.options.scales.y.max = Math.ceil(maxPop / 100) * 100;
    chartSize.update();

    // Growth Rate vs N — each point is (N, growth rate at that N)
    chartGrowth.data.labels = historyGrowth.map(h => h.N.toFixed(1));
    chartGrowth.data.datasets[0].data = historyGrowth.map(h => h.rate);
    const maxGrowth = Math.max(...historyGrowth.map(h => Math.abs(h.rate)), 10);
    chartGrowth.options.scales.y.max = Math.ceil(maxGrowth * 1.3);
    chartGrowth.options.scales.y.min = -Math.ceil(maxGrowth * 0.3);
    chartGrowth.update();

    // Per Capita Growth Rate vs N
    chartPerCapita.data.labels = historyPerCapita.map(h => h.N.toFixed(1));
    chartPerCapita.data.datasets[0].data = historyPerCapita.map(h => h.rate);
    const maxPC = Math.max(...historyPerCapita.map(h => Math.abs(h.rate)), 1);
    chartPerCapita.options.scales.y.max = Math.ceil(maxPC * 1.3 * 10) / 10;
    chartPerCapita.options.scales.y.min = -Math.ceil(maxPC * 0.3 * 10) / 10;
    chartPerCapita.update();
  }

  function initCharts() {
    const ctxSize = document.getElementById('popSizeChart').getContext('2d');
    chartSize = new Chart(ctxSize, {
      type: 'line',
      data: { labels: [], datasets: [{
        label: 'N(t)', data: [], borderColor: '#c0392b',
        backgroundColor: 'transparent', borderWidth: 2.5,
        pointRadius: 0, tension: 0.1, fill: false,
      }]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { title: { display: true, text: 'Time (t)', font: { size: 8 } }, ticks: { font: { size: 7 } } },
          y: { title: { display: true, text: 'Population Size (N)', font: { size: 8 } }, ticks: { font: { size: 7 } }, beginAtZero: true }
        }
      }
    });

    const ctxGrowth = document.getElementById('growthRateChart').getContext('2d');
    chartGrowth = new Chart(ctxGrowth, {
      type: 'line',
      data: { labels: [], datasets: [{
        label: 'dN/dt', data: [], borderColor: '#c0392b',
        backgroundColor: 'transparent', borderWidth: 2.5,
        pointRadius: 0, tension: 0.1, fill: false,
      }]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { title: { display: true, text: 'Population Size (N)', font: { size: 8 } }, ticks: { font: { size: 7 } } },
          y: { title: { display: true, text: 'dN/dt', font: { size: 8 } }, ticks: { font: { size: 7 } } }
        }
      }
    });

    const ctxPerCapita = document.getElementById('perCapitaChart').getContext('2d');
    chartPerCapita = new Chart(ctxPerCapita, {
      type: 'line',
      data: { labels: [], datasets: [{
        label: 'dN/dt / N', data: [], borderColor: '#1e6fa3',
        backgroundColor: 'transparent', borderWidth: 2.5,
        pointRadius: 0, tension: 0.1, fill: false,
      }]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { title: { display: true, text: 'Population Size (N)', font: { size: 8 } }, ticks: { font: { size: 7 } } },
          y: { title: { display: true, text: 'dN/dt / N', font: { size: 8 } }, ticks: { font: { size: 7 } } }
        }
      }
    });
  }

  // ---------- reset ----------
  function resetSimulation() {
    isRunning = false;
    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
    document.getElementById('goBtn').classList.remove('running');
    document.getElementById('goBtn').textContent = 'Go';

    currentTime = 0;
    population = N0;

    // Clear history
    historyTimes.length = 0;
    historyPops.length = 0;
    historyGrowth.length = 0;
    historyPerCapita.length = 0;

    // Initialize agents from N0
    agents = [];
    const dots = popToDots(N0);
    for (let i = 0; i < dots; i++) {
      agents.push(spawnAgent('normal'));
    }

    // Record initial state
    historyTimes.push(0);
    historyPops.push(population);
    historyGrowth.push({ N: population, rate: 0 });
    historyPerCapita.push({ N: population, rate: 0 });

    drawWorld();
    document.getElementById('tickDisplay').textContent =
      `t = 0.00  |  N = ${population}`;
    document.getElementById('birthsDisplay').textContent = '0';
    document.getElementById('deathsDisplay').textContent = '0';

    updateCharts();
  }

  // ---------- go / pause ----------
  function toggleGo() {
    const goBtn = document.getElementById('goBtn');
    if (isRunning) {
      isRunning = false;
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      goBtn.classList.remove('running');
      goBtn.textContent = 'Go';
    } else {
      if (currentTime >= T_MAX) {
        resetSimulation();
      }
      isRunning = true;
      goBtn.classList.add('running');
      goBtn.textContent = 'Pause';
      stepSimulation();
    }
  }

  // ---------- slider binding ----------
  function bindSliders() {
    const n0Slider = document.getElementById('n0Slider');
    const rSlider = document.getElementById('rSlider');
    const kSlider = document.getElementById('kSlider');
    const speedSlider = document.getElementById('speedSlider');

    n0Slider.addEventListener('input', (e) => {
      N0 = parseFloat(e.target.value);
      if (N0 > K) { N0 = Math.min(N0, K - 1); n0Slider.value = N0; }
      document.getElementById('n0ValDisplay').textContent = N0;
      resetSimulation();
    });

    rSlider.addEventListener('input', (e) => {
      r = parseFloat(e.target.value);
      document.getElementById('rValDisplay').textContent = r.toFixed(2);
      resetSimulation();
    });

    kSlider.addEventListener('input', (e) => {
      K = parseFloat(e.target.value);
      if (N0 > K) {
        N0 = Math.min(N0, K - 1);
        n0Slider.value = N0;
        document.getElementById('n0ValDisplay').textContent = N0;
      }
      const maxN0 = Math.min(300, K - 1);
      n0Slider.max = maxN0;
      if (N0 > maxN0) {
        N0 = maxN0;
        n0Slider.value = N0;
        document.getElementById('n0ValDisplay').textContent = N0;
      }
      document.getElementById('kValDisplay').textContent = K;
      resetSimulation();
    });

    speedSlider.addEventListener('input', (e) => {
      speedFactor = parseFloat(e.target.value);
      document.getElementById('speedValue').textContent = speedFactor;
    });

    const maxN0 = Math.min(300, K - 1);
    n0Slider.max = maxN0;
  }

  // ---------- start ----------
  window.addEventListener('load', () => {
    initCharts();
    bindSliders();

    N0 = 10; r = 1.2; K = 600;
    document.getElementById('n0Slider').value = N0;
    document.getElementById('rSlider').value = r;
    document.getElementById('kSlider').value = K;
    document.getElementById('n0ValDisplay').textContent = N0;
    document.getElementById('rValDisplay').textContent = r.toFixed(2);
    document.getElementById('kValDisplay').textContent = K;
    document.getElementById('speedSlider').value = speedFactor;
    document.getElementById('speedValue').textContent = speedFactor;

    const maxN0 = Math.min(300, K - 1);
    document.getElementById('n0Slider').max = maxN0;

    resetSimulation();

    document.getElementById('setupBtn').addEventListener('click', resetSimulation);
    document.getElementById('goBtn').addEventListener('click', toggleGo);
  });

})();
</script>
</body>
</html>
