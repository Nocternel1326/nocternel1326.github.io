<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistic Growth · Real Population Simulation</title>
  <!-- Chart.js for the three plots -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    }

    body {
      background: #fdf8e0;      /* light yellow background for whole page */
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* main panel – slightly darker yellow */
    .netlogo-panel {
      background: #f5eec8;
      border-radius: 1.5rem;
      padding: 1.5rem 2rem 1.8rem 2rem;
      max-width: 1400px;
      width: fit-content;
      box-shadow: 0 20px 30px -10px rgba(120, 100, 40, 0.5);
      border: 2px solid #d4c48a;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      color: #3a3020;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .title-section h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      color: #3a3020;
      letter-spacing: 0.2px;
    }

    /* speed slider row */
    .speed-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0.5rem 0 1.2rem 0;
      color: #4a3f28;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .speed-row input {
      flex: 1;
      height: 8px;
      -webkit-appearance: none;
      background: #d4c48a;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #b8a86a;
    }

    .speed-row input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #8a7a4a;
      border-radius: 50%;
      border: 2px solid #fff8d8;
      box-shadow: 0 2px 6px rgba(80, 60, 20, 0.5);
      cursor: pointer;
    }

    /* main simulation area */
    .world-and-params {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Light yellow world background */
    .world-container {
      background: #fdf8e0;
      border-radius: 12px;
      padding: 6px;
      box-shadow: inset 0 0 12px #d4cba6, 0 8px 12px rgba(120, 100, 40, 0.4);
      border: 2px solid #c8b87a;
    }

    .world-canvas {
      display: block;
      width: 500px;
      height: 300px;
      border-radius: 6px;
      background: #fdf8e0;
    }

    .tick-label {
      margin-top: 8px;
      font-family: 'SF Mono', monospace;
      font-size: 0.85rem;
      color: #5a4a2a;
      padding-left: 6px;
      font-weight: 600;
    }

    /* right side parameters */
    .params-panel {
      background: #efe6c0;
      border-radius: 12px;
      padding: 1rem 1.5rem 1.2rem 1.5rem;
      box-shadow: inset 0 1px 3px #fff8e0, 0 6px 10px rgba(120, 100, 40, 0.3);
      border: 2px solid #d4c48a;
      min-width: 300px;
      color: #3a3020;
    }

    .params-panel h2 {
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      margin: 0 0 0.75rem 0;
      color: #3a3020;
      letter-spacing: 0.5px;
    }

    .param-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .slider-item .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a3f28;
    }

    .slider-item .label-row span:last-child {
      font-family: 'SF Mono', monospace;
      background: #fff8e0;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      font-size: 0.8rem;
      border: 1px solid #c8b87a;
      color: #3a3020;
    }

    .slider-item input[type=range] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: #d4c48a;
      border-radius: 10px;
      margin: 5px 0 2px;
      border: 1px solid #b8a86a;
    }

    .slider-item input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #8a7a4a;
      border-radius: 50%;
      border: 2px solid #fff8d8;
      box-shadow: 0 1px 5px rgba(80, 60, 20, 0.5);
      cursor: pointer;
    }

    /* births/deaths row */
    .birth-death-row {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
      justify-content: center;
    }

    .bd-box {
      background: #fff8e0;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      text-align: center;
      border: 2px solid #c8b87a;
      box-shadow: inset 0 1px 4px #ffffff, 0 2px 3px rgba(120, 100, 40, 0.2);
      min-width: 80px;
    }

    .bd-box .bd-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #5a4a2a;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .bd-box .bd-value {
      font-family: 'SF Mono', monospace;
      font-weight: 700;
      font-size: 1.2rem;
      color: #3a3020;
    }

    .bd-box.births .bd-value {
      color: #1a7a1a;
    }

    .bd-box.deaths .bd-value {
      color: #b02020;
    }

    /* buttons */
    .button-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .btn {
      background: #8a7a4a;
      border: none;
      color: #fff8e0;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.6rem 1.5rem;
      border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #5a4a2a, 0 5px 12px rgba(80, 60, 20, 0.4);
      cursor: pointer;
      transition: all 0.08s ease;
      border: 1px solid #a89a5a;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5a4a2a, 0 5px 12px rgba(80, 60, 20, 0.4);
    }

    .btn-setup {
      background: #a89a5a;
    }

    .btn-go {
      background: #5a8a4a;
    }

    .btn-go.running {
      background: #b04040;
      border-color: #d06060;
    }

    /* three charts row */
    .charts-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-top: 1.8rem;
      justify-content: center;
    }

    .chart-card {
      background: #fffdf0;
      border-radius: 10px;
      padding: 0.8rem 0.8rem 0.3rem 0.8rem;
      box-shadow: 0 6px 12px rgba(120, 100, 40, 0.3);
      border: 2px solid #d4c48a;
      flex: 1 1 240px;
      max-width: 280px;
    }

    .chart-card .chart-title {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      color: #3a3020;
      margin-bottom: 0.2rem;
      padding: 0 0.2rem;
    }

    .chart-card .chart-title span:last-child {
      color: #8a7a4a;
      font-weight: 400;
    }

    .chart-card canvas {
      width: 100% !important;
      height: 140px !important;
      max-height: 140px;
    }
  </style>
</head>
<body>
<div class="netlogo-panel">
  <!-- header -->
  <div class="header">
    <div class="title-section">
      <h1>🌿 Logistic Growth · Real Population Simulation</h1>
    </div>
  </div>

  <!-- speed slider -->
  <div class="speed-row">
    <span style="min-width:50px;">Speed</span>
    <input type="range" id="speedSlider" min="1" max="20" value="8" step="1">
    <span id="speedValue" style="min-width: 45px; font-family: monospace;">8</span>
  </div>

  <!-- main world + parameters -->
  <div class="world-and-params">
    <!-- left: world canvas and tick counter -->
    <div>
      <div class="world-container">
        <canvas id="worldCanvas" class="world-canvas" width="500" height="300"></canvas>
      </div>
      <div class="tick-label" id="tickDisplay">t = 0.00  |  N = 10</div>
    </div>

    <!-- right: parameters panel -->
    <div class="params-panel">
      <h2>Population Parameters</h2>
      <div class="param-group">
        <div class="slider-item">
          <div class="label-row">
            <span>Initial Population (N₀)</span>
            <span id="n0ValDisplay">10</span>
          </div>
          <input type="range" id="n0Slider" min="1" max="300" value="10" step="1">
        </div>
        <div class="slider-item">
          <div class="label-row">
            <span>Growth Rate (r)</span>
            <span id="rValDisplay">1.20</span>
          </div>
          <input type="range" id="rSlider" min="0.1" max="1.5" value="1.2" step="0.01">
        </div>
        <div class="slider-item">
          <div class="label-row">
            <span>Carrying Capacity (K)</span>
            <span id="kValDisplay">600</span>
          </div>
          <input type="range" id="kSlider" min="100" max="1000" value="600" step="10">
        </div>
      </div>

      <!-- Births / Deaths per tick -->
      <div class="birth-death-row">
        <div class="bd-box births">
          <div class="bd-label">Births/tick</div>
          <div class="bd-value" id="birthsDisplay">0</div>
        </div>
        <div class="bd-box deaths">
          <div class="bd-label">Deaths/tick</div>
          <div class="bd-value" id="deathsDisplay">0</div>
        </div>
      </div>

      <!-- Setup / Go buttons -->
      <div class="button-row">
        <button class="btn btn-setup" id="setupBtn">Setup</button>
        <button class="btn btn-go" id="goBtn">Go</button>
      </div>
    </div>
  </div>

  <!-- three charts row -->
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">
        <span>Population Size</span>
        <span>☰</span>
      </div>
      <canvas id="popSizeChart" width="240" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">
        <span>Population Growth Rate</span>
        <span>☰</span>
      </div>
      <canvas id="growthRateChart" width="240" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">
        <span>Per Capita Growth Rate</span>
        <span>☰</span>
      </div>
      <canvas id="perCapitaChart" width="240" height="140"></canvas>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- simulation parameters ----------
    let N0 = 10;
    let r = 1.2;
    let K = 600;

    // ---- speed control ----
    let speedFactor = 8;
    const BASE_SPEED = 0.015;

    // ---- animation state ----
    let currentTime = 0;
    let isRunning = false;
    let animationFrame = null;
    const T_MAX = 30;
    const STEPS = 300;
    const DT = T_MAX / STEPS;

    // precomputed curve
    let fullTimes = [];
    let fullPops = [];

    // ---- world canvas ----
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const worldWidth = 500, worldHeight = 300;

    // Agent representation: each agent has {x, y, state, age}
    // state: 'normal' (black), 'born' (green), 'dying' (red X)
    let agents = [];

    // ---- logistic curve (RK4) ----
    function computeLogisticCurve(rVal, KVal, N0Val) {
      const times = [];
      const pops = [];
      let N = N0Val;
      for (let i = 0; i <= STEPS; i++) {
        const t = i * DT;
        times.push(t);
        pops.push(N);
        const f = (n) => rVal * n * (1 - n / KVal);
        const k1 = f(N);
        const k2 = f(N + 0.5 * DT * k1);
        const k3 = f(N + 0.5 * DT * k2);
        const k4 = f(N + DT * k3);
        N = N + (DT / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
        if (N > KVal) N = KVal;
        if (N < 0) N = 0;
      }
      return { times, pops };
    }

    // ---- get population at simulation time t ----
    function getPopulationAtTime(t) {
      if (fullTimes.length === 0) return N0;
      const clampedT = Math.min(Math.max(t, 0), T_MAX);
      let idx = 0;
      for (let i = 0; i < fullTimes.length; i++) {
        if (fullTimes[i] >= clampedT) {
          idx = i;
          break;
        }
        idx = i;
      }
      if (idx === 0) return fullPops[0];
      const t0 = fullTimes[idx - 1];
      const t1 = fullTimes[idx];
      const p0 = fullPops[idx - 1];
      const p1 = fullPops[idx];
      if (t1 === t0) return p1;
      const frac = (clampedT - t0) / (t1 - t0);
      return p0 + frac * (p1 - p0);
    }

    // ---- synchronize agents with target population ----
    // Returns {births, deaths} — the actual number of agents added/removed
    function syncAgents(targetPop) {
      // Scale population to number of visible dots
      const maxDots = 350;
      const targetDots = Math.min(maxDots, Math.round((targetPop / Math.max(K, 1)) * maxDots));
      const currentDots = agents.length;

      let birthsThisTick = 0;
      let deathsThisTick = 0;

      // ---- DEATHS: remove agents ----
      if (targetDots < currentDots) {
        const deathsNeeded = currentDots - targetDots;
        // First, clear out any 'dying' agents from previous tick (they're dead now)
        const stillAlive = agents.filter(a => a.state !== 'dying');
        const dyingCount = agents.length - stillAlive.length;
        agents = stillAlive;

        // Mark additional agents as dying (including possibly some newborns)
        const remainingDeaths = Math.max(0, deathsNeeded - dyingCount);
        deathsThisTick = Math.min(remainingDeaths, agents.length);

        // Pick random agents to mark as dying
        const indices = agents.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        for (let i = 0; i < deathsThisTick; i++) {
          agents[indices[i]].state = 'dying';
        }

        // Remove the ones that died *this* tick (keep them for one frame to show the X)
        // Actually, we keep dying agents for this frame, and they'll be removed next tick.
        // To make the removal happen now, we need to remove the ones that were already dying
        // from before. The logic above handles that.
        // But we also need to account for the deaths from previous tick that were already marked.
        // Let's simplify: 
        // 1. Remove all agents with state 'dying' (they died last tick, now gone)
        // 2. Mark new agents as 'dying' for the current tick
        // 3. Show both normal and newly-dying agents
        // But that means the number of visible agents will be targetDots + deathsThisTick
        // which is okay — the dying ones are still shown with X.

        // Recompute: after removing old dying agents, we have some number of normal agents.
        // We want targetDots normal agents (alive) plus deathsThisTick dying agents.
        // So the total number of agents (alive + dying) should be targetDots + deathsThisTick.
        // Let's redo the counting to be precise.
      }

      // Let's use a cleaner approach:
      // 1. Remove all 'dying' agents from the previous tick (they're gone now).
      // 2. Count how many 'normal' agents we have (alive).
      // 3. If we need more dots (targetDots > aliveCount), create new 'born' agents.
      // 4. If we need fewer dots (targetDots < aliveCount), mark (aliveCount - targetDots) agents as 'dying'.
      // 5. The world shows: normal agents + born agents (green) + dying agents (red X).
      // 6. At the start of the next tick, dying agents are removed.

      // This way, births and deaths are visible each tick.

      // ---- Step 1: remove agents that died in the previous tick ----
      const beforeRemoval = agents.length;
      agents = agents.filter(a => a.state !== 'dying');
      const removedFromPrev = beforeRemoval - agents.length;

      // ---- Step 2: count current alive agents (normal + born from last tick become normal) ----
      // Promote 'born' to 'normal' (they survived their birth tick)
      for (let a of agents) {
        if (a.state === 'born') a.state = 'normal';
      }

      const aliveCount = agents.length;

      // ---- Step 3: handle births ----
      let births = 0;
      if (targetDots > aliveCount) {
        births = targetDots - aliveCount;
        for (let i = 0; i < births; i++) {
          agents.push({
            x: Math.random() * (worldWidth - 8) + 4,
            y: Math.random() * (worldHeight - 8) + 4,
            state: 'born',
            age: 0
          });
        }
      }

      // ---- Step 4: handle deaths ----
      let deaths = 0;
      if (targetDots < aliveCount) {
        deaths = aliveCount - targetDots;
        // Mark random normal agents as dying
        const normalIndices = agents
          .map((a, i) => a.state === 'normal' ? i : -1)
          .filter(i => i !== -1);
        // Shuffle
        for (let i = normalIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [normalIndices[i], normalIndices[j]] = [normalIndices[j], normalIndices[i]];
        }
        const toMark = Math.min(deaths, normalIndices.length);
        for (let i = 0; i < toMark; i++) {
          agents[normalIndices[i]].state = 'dying';
        }
        // If we couldn't mark enough (all were already dying or born), mark any remaining
        if (toMark < deaths) {
          let remaining = deaths - toMark;
          for (let i = 0; i < agents.length && remaining > 0; i++) {
            if (agents[i].state === 'normal') {
              agents[i].state = 'dying';
              remaining--;
            }
          }
        }
      }

      // ---- Return the counts for this tick ----
      return { births: births, deaths: deaths };
    }

    // ---- draw world ----
    function drawWorld() {
      // Clear with light yellow
      ctx.fillStyle = '#fdf8e0';
      ctx.fillRect(0, 0, worldWidth, worldHeight);

      // Draw agents
      for (let a of agents) {
        if (a.state === 'dying') {
          // Red X for dying agents
          ctx.strokeStyle = '#cc2222';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(a.x - 4, a.y - 4);
          ctx.lineTo(a.x + 4, a.y + 4);
          ctx.moveTo(a.x + 4, a.y - 4);
          ctx.lineTo(a.x - 4, a.y + 4);
          ctx.stroke();
        } else if (a.state === 'born') {
          // Green dot for newborns
          ctx.fillStyle = '#22aa22';
          ctx.beginPath();
          ctx.arc(a.x, a.y, 3.0, 0, 2 * Math.PI);
          ctx.fill();
        } else {
          // Normal black dot
          ctx.fillStyle = '#111111';
          ctx.beginPath();
          ctx.arc(a.x, a.y, 1.8, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    // ---- step simulation ----
    function stepSimulation() {
      if (!isRunning) return;

      // Advance time
      const timeIncrement = BASE_SPEED * speedFactor;
      currentTime += timeIncrement;

      if (currentTime >= T_MAX) {
        currentTime = T_MAX;
        isRunning = false;
        document.getElementById('goBtn').classList.remove('running');
        document.getElementById('goBtn').textContent = 'Go';
      }

      // Get target population
      const targetPop = getPopulationAtTime(currentTime);

      // Sync agents (returns births and deaths)
      const { births, deaths } = syncAgents(targetPop);

      // Update display
      drawWorld();
      document.getElementById('tickDisplay').textContent =
        `t = ${currentTime.toFixed(2)}  |  N = ${Math.round(targetPop)}`;
      document.getElementById('birthsDisplay').textContent = births;
      document.getElementById('deathsDisplay').textContent = deaths;

      if (isRunning) {
        animationFrame = requestAnimationFrame(stepSimulation);
      } else {
        drawWorld();
      }
    }

    // ---- reset simulation ----
    function resetSimulation() {
      isRunning = false;
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      document.getElementById('goBtn').classList.remove('running');
      document.getElementById('goBtn').textContent = 'Go';

      currentTime = 0;

      // Recompute curve
      const { times, pops } = computeLogisticCurve(r, K, N0);
      fullTimes = times;
      fullPops = pops;

      // Initialize agents from N0
      const initialPop = getPopulationAtTime(0);
      const maxDots = 350;
      const initialDots = Math.min(maxDots, Math.round((initialPop / Math.max(K, 1)) * maxDots));
      agents = [];
      for (let i = 0; i < initialDots; i++) {
        agents.push({
          x: Math.random() * (worldWidth - 8) + 4,
          y: Math.random() * (worldHeight - 8) + 4,
          state: 'normal',
          age: 0
        });
      }

      drawWorld();
      document.getElementById('tickDisplay').textContent =
        `t = 0.00  |  N = ${Math.round(initialPop)}`;
      document.getElementById('birthsDisplay').textContent = '0';
      document.getElementById('deathsDisplay').textContent = '0';

      updateCharts();
    }

    // ---- go / pause ----
    function toggleGo() {
      const goBtn = document.getElementById('goBtn');
      if (isRunning) {
        isRunning = false;
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        goBtn.classList.remove('running');
        goBtn.textContent = 'Go';
      } else {
        if (currentTime >= T_MAX) {
          currentTime = 0;
          resetSimulation();
        }
        isRunning = true;
        goBtn.classList.add('running');
        goBtn.textContent = 'Pause';
        stepSimulation();
      }
    }

    // ---- charts ----
    let chartSize, chartGrowth, chartPerCapita;

    function updateCharts() {
      const { times, pops } = computeLogisticCurve(r, K, N0);
      fullTimes = times;
      fullPops = pops;

      chartSize.data.labels = times.map(t => t.toFixed(2));
      chartSize.data.datasets[0].data = pops;
      const maxPop = Math.max(K * 1.15, ...pops);
      chartSize.options.scales.y.max = Math.ceil(maxPop / 100) * 100;
      chartSize.update();

      const growthRates = pops.map(N => r * N * (1 - N / K));
      chartGrowth.data.labels = pops.map(n => n.toFixed(1));
      chartGrowth.data.datasets[0].data = growthRates;
      const maxGrowth = Math.max(...growthRates, 0);
      chartGrowth.options.scales.y.max = Math.ceil(maxGrowth * 1.15) || 10;
      chartGrowth.update();

      const perCapita = pops.map((N) => {
        if (N < 0.001) return r;
        return r * (1 - N / K);
      });
      chartPerCapita.data.labels = pops.map(n => n.toFixed(1));
      chartPerCapita.data.datasets[0].data = perCapita;
      chartPerCapita.options.scales.y.max = Math.max(r * 1.2, ...perCapita) + 0.2;
      chartPerCapita.options.scales.y.min = Math.min(0, ...perCapita) - 0.1;
      chartPerCapita.update();
    }

    // ---- initialize charts ----
    function initCharts() {
      const ctxSize = document.getElementById('popSizeChart').getContext('2d');
      chartSize = new Chart(ctxSize, {
        type: 'line',
        data: { labels: [], datasets: [{
          label: 'N(t)', data: [], borderColor: '#c0392b',
          backgroundColor: 'transparent', borderWidth: 2.5,
          pointRadius: 0, tension: 0.2, fill: false,
        }]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { title: { display: true, text: 'Time (t)', font: { size: 8 } }, ticks: { font: { size: 7 } } },
            y: { title: { display: true, text: 'Population Size (N)', font: { size: 8 } }, ticks: { font: { size: 7 } }, beginAtZero: true }
          }
        }
      });

      const ctxGrowth = document.getElementById('growthRateChart').getContext('2d');
      chartGrowth = new Chart(ctxGrowth, {
        type: 'line',
        data: { labels: [], datasets: [{
          label: 'dN/dt', data: [], borderColor: '#c0392b',
          backgroundColor: 'transparent', borderWidth: 2.5,
          pointRadius: 0, tension: 0.2, fill: false,
        }]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { title: { display: true, text: 'Population Size (N)', font: { size: 8 } }, ticks: { font: { size: 7 } } },
            y: { title: { display: true, text: 'dN/dt', font: { size: 8 } }, ticks: { font: { size: 7 } }, beginAtZero: true }
          }
        }
      });

      const ctxPerCapita = document.getElementById('perCapitaChart').getContext('2d');
      chartPerCapita = new Chart(ctxPerCapita, {
        type: 'line',
        data: { labels: [], datasets: [{
          label: 'dN/dt / N', data: [], borderColor: '#1e6fa3',
          backgroundColor: 'transparent', borderWidth: 2.5,
          pointRadius: 0, tension: 0.1, fill: false,
        }]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { title: { display: true, text: 'Population Size (N)', font: { size: 8 } }, ticks: { font: { size: 7 } } },
            y: { title: { display: true, text: 'dN/dt / N', font: { size: 8 } }, ticks: { font: { size: 7 } } }
          }
        }
      });
    }

    // ---- slider binding ----
    function bindSliders() {
      const n0Slider = document.getElementById('n0Slider');
      const rSlider = document.getElementById('rSlider');
      const kSlider = document.getElementById('kSlider');
      const speedSlider = document.getElementById('speedSlider');

      n0Slider.addEventListener('input', (e) => {
        N0 = parseFloat(e.target.value);
        if (N0 > K) { N0 = Math.min(N0, K - 1); n0Slider.value = N0; }
        document.getElementById('n0ValDisplay').textContent = N0;
        resetSimulation();
      });

      rSlider.addEventListener('input', (e) => {
        r = parseFloat(e.target.value);
        document.getElementById('rValDisplay').textContent = r.toFixed(2);
        resetSimulation();
      });

      kSlider.addEventListener('input', (e) => {
        K = parseFloat(e.target.value);
        if (N0 > K) {
          N0 = Math.min(N0, K - 1);
          n0Slider.value = N0;
          document.getElementById('n0ValDisplay').textContent = N0;
        }
        const maxN0 = Math.min(300, K - 1);
        n0Slider.max = maxN0;
        if (N0 > maxN0) {
          N0 = maxN0;
          n0Slider.value = N0;
          document.getElementById('n0ValDisplay').textContent = N0;
        }
        document.getElementById('kValDisplay').textContent = K;
        resetSimulation();
      });

      speedSlider.addEventListener('input', (e) => {
        speedFactor = parseFloat(e.target.value);
        document.getElementById('speedValue').textContent = speedFactor;
      });

      const maxN0 = Math.min(300, K - 1);
      n0Slider.max = maxN0;
    }

    // ---- start ----
    window.addEventListener('load', () => {
      initCharts();
      bindSliders();

      N0 = 10; r = 1.2; K = 600;
      document.getElementById('n0Slider').value = N0;
      document.getElementById('rSlider').value = r;
      document.getElementById('kSlider').value = K;
      document.getElementById('n0ValDisplay').textContent = N0;
      document.getElementById('rValDisplay').textContent = r.toFixed(2);
      document.getElementById('kValDisplay').textContent = K;
      document.getElementById('speedSlider').value = speedFactor;
      document.getElementById('speedValue').textContent = speedFactor;

      const maxN0 = Math.min(300, K - 1);
      document.getElementById('n0Slider').max = maxN0;

      resetSimulation();

      document.getElementById('setupBtn').addEventListener('click', resetSimulation);
      document.getElementById('goBtn').addEventListener('click', toggleGo);
    });

  })();
</script>
</body>
</html>
