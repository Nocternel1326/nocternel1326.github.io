name: Submit Chord Progression
description: Submit a new chord progression to the library
title: "[Chord] "
labels: ["submission", "pending"]
body:
  - type: input
    id: name
    attributes:
      label: Progression Name
      description: 'Example: ii-V-I'
      placeholder: 'ii-V-I'
    validations:
      required: true

  - type: input
    id: numerals
    attributes:
      label: Roman Numerals
      description: 'Space-separated. Example: ii V I'
      placeholder: 'ii V I'
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - major
        - minor
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      description: 'Where did you hear this? Why is it useful?'
    validations:
      required: false

  - type: input
    id: contributor
    attributes:
      label: Your Name (optional)
      description: 'How would you like to be credited?'
    validations:
      required: false
