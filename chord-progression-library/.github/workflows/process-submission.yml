name: Process Chord Submission

on:
  issues:
    types: [opened]

jobs:
  validate:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'submission')
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse issue form
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            function extract(label) {
              const re = new RegExp('### ' + label + '\\s*\\n\\s*([^\\n#]+)');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }
            const name = extract('Progression Name');
            const numeralsRaw = extract('Roman Numerals');
            const mode = extract('Mode');
            const contributor = extract('Your Name \\(optional\\)') || 'anonymous';

            if (!name || !numeralsRaw || !mode) {
              core.setFailed('Missing required fields');
              return;
            }
            const numerals = numeralsRaw.split(/\s+/).filter(Boolean);

            const entry = {
              name: name,
              numerals: numerals,
              mode: mode,
              contributor: contributor,
              issueNumber: context.issue.number
            };

            core.setOutput('entry', JSON.stringify(entry));
            core.setOutput('name', name);

      - name: Add to submissions folder
        run: |
          mkdir -p submissions
          echo '${{ steps.parse.outputs.entry }}' > submissions/issue-${{ github.event.issue.number }}.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Add chord submission from issue #${{ github.event.issue.number }}'
          title: 'Chord submission: ${{ steps.parse.outputs.name }}'
          body: |
            Auto-generated from issue #${{ github.event.issue.number }}.
            Review the JSON in `submissions/` before merging.
          branch: chord-submission-${{ github.event.issue.number }}
          delete-branch: true
